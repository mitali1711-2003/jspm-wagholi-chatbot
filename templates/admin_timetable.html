<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timetable — Admin</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .tt-main { max-width: 1000px; margin: 40px auto; padding: 0 24px; }
        .tt-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; }
        .tt-header h2 { font-size: 22px; font-weight: 700; }
        .tt-table-wrap { background: var(--card-light); border-radius: var(--radius-lg); box-shadow: var(--shadow); overflow: hidden; }
        .tt-table-wrap table { width: 100%; border-collapse: collapse; }
        .tt-table-wrap th { background: var(--primary); color: #fff; padding: 12px 16px; text-align: left; font-size: 13px; font-weight: 600; }
        .tt-table-wrap td { padding: 12px 16px; border-bottom: 1px solid var(--border-light); font-size: 14px; vertical-align: middle; }
        .tt-table-wrap tr:last-child td { border-bottom: none; }
        .tt-table-wrap tr:hover td { background: var(--hover-light,rgba(0,0,0,.03)); }
        .badge-active { background:#d1fae5; color:#065f46; padding:2px 10px; border-radius:999px; font-size:12px; font-weight:600; }
        .badge-inactive { background:#fee2e2; color:#991b1b; padding:2px 10px; border-radius:999px; font-size:12px; font-weight:600; }
        .btn-icon { background:none; border:none; cursor:pointer; padding:4px 8px; border-radius:6px; font-size:16px; }
        .btn-icon:hover { background:var(--border-light); }
        .empty-state { text-align:center; padding:60px 20px; color: var(--text-muted,#888); font-size:15px; }

        /* Modal */
        .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:1000; align-items:center; justify-content:center; }
        .modal-overlay.open { display:flex; }
        .modal { background:var(--card-light); border-radius:var(--radius-lg); padding:32px; width:100%; max-width:500px; box-shadow:0 20px 60px rgba(0,0,0,.2); }
        .modal h3 { font-size:18px; font-weight:700; margin-bottom:24px; }
        .form-group { margin-bottom:16px; }
        .form-group label { display:block; font-size:13px; font-weight:600; margin-bottom:6px; }
        .form-group input, .form-group select, .form-group textarea {
            width:100%; padding:10px 14px; border:2px solid var(--border-light);
            border-radius:var(--radius); font-size:14px;
            background:var(--bg-light); color:var(--text-light); box-sizing:border-box;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline:none; border-color:var(--primary); }
        .form-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
        .modal-actions { display:flex; justify-content:flex-end; gap:12px; margin-top:24px; }
        [data-theme="dark"] .tt-table-wrap td { border-color: var(--border-dark, #333); }
        [data-theme="dark"] .tt-table-wrap th { background: #3b5bdb; }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="{{ url_for('dashboard') }}" class="navbar-brand">CampusBot Admin</a>
        <div class="navbar-links">
            <a href="{{ url_for('dashboard') }}">Dashboard</a>
            <a href="{{ url_for('admin_panel') }}">FAQs</a>
            <a href="{{ url_for('admin_analytics') }}">Analytics</a>
            <a href="{{ url_for('admin_conversations') }}">Conversations</a>
            <a href="{{ url_for('admin_security') }}">Security</a>
            <a href="{{ url_for('admin_canteen') }}">Canteen</a>
            <a href="{{ url_for('admin_feedback') }}">Feedback</a>
            <a href="{{ url_for('admin_map') }}">Map</a>
            <a href="{{ url_for('admin_timetable') }}" style="color:var(--primary);">Timetable</a>
            <button class="theme-toggle" onclick="toggleTheme()">&#9790;</button>
            <a href="{{ url_for('logout') }}">Logout</a>
        </div>
    </nav>

    <div class="tt-main">
        <div class="tt-header">
            <h2>&#128197; Exam Timetable</h2>
            <button class="btn btn-primary" onclick="openModal()">+ Add Entry</button>
        </div>

        <div class="tt-table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Exam / Event</th>
                        <th>Date</th>
                        <th>Branch</th>
                        <th>Semester</th>
                        <th>Note</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="ttBody">
                    <tr><td colspan="8" class="empty-state">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Add / Edit Modal -->
    <div class="modal-overlay" id="ttModal">
        <div class="modal">
            <h3 id="modalTitle">Add Timetable Entry</h3>
            <input type="hidden" id="editId">

            <div class="form-group">
                <label>Exam / Event Name *</label>
                <input type="text" id="fExamName" placeholder="e.g. Mid-Sem Exam — Computer Science">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Date *</label>
                    <input type="date" id="fExamDate">
                </div>
                <div class="form-group">
                    <label>Branch</label>
                    <input type="text" id="fBranch" placeholder="e.g. All / CSE / MECH">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Semester</label>
                    <input type="text" id="fSemester" placeholder="e.g. Sem III">
                </div>
                <div class="form-group">
                    <label>Status</label>
                    <select id="fActive">
                        <option value="1">Active (shown on dashboard)</option>
                        <option value="0">Hidden</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>Note</label>
                <input type="text" id="fNote" placeholder="e.g. Carry college ID, Hall ticket required">
            </div>

            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                <button class="btn btn-primary" onclick="saveEntry()">Save</button>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
    <script>
    let entries = [];

    async function loadEntries() {
        const res = await fetch('/api/admin/timetable');
        entries = await res.json();
        render();
    }

    function render() {
        const tbody = document.getElementById('ttBody');
        if (!entries.length) {
            tbody.innerHTML = '<tr><td colspan="8" class="empty-state">No entries yet. Click "+ Add Entry" to get started.</td></tr>';
            return;
        }
        tbody.innerHTML = entries.map((e, i) => `
            <tr>
                <td>${i + 1}</td>
                <td><strong>${esc(e.exam_name)}</strong></td>
                <td>${formatDate(e.exam_date)}</td>
                <td>${esc(e.branch || 'All')}</td>
                <td>${esc(e.semester || '—')}</td>
                <td>${esc(e.note || '—')}</td>
                <td><span class="${e.is_active ? 'badge-active' : 'badge-inactive'}">${e.is_active ? 'Active' : 'Hidden'}</span></td>
                <td>
                    <button class="btn-icon" title="Edit" onclick="openModal(${e.id})">&#9998;</button>
                    <button class="btn-icon" title="Delete" onclick="deleteEntry(${e.id})" style="color:#e53e3e;">&#128465;</button>
                </td>
            </tr>
        `).join('');
    }

    function formatDate(d) {
        if (!d) return '—';
        const dt = new Date(d + 'T00:00:00');
        return dt.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
    }

    function esc(s) {
        return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function openModal(id) {
        document.getElementById('editId').value = id || '';
        if (id) {
            const e = entries.find(x => x.id === id);
            document.getElementById('modalTitle').textContent = 'Edit Timetable Entry';
            document.getElementById('fExamName').value = e.exam_name;
            document.getElementById('fExamDate').value = e.exam_date;
            document.getElementById('fBranch').value = e.branch || '';
            document.getElementById('fSemester').value = e.semester || '';
            document.getElementById('fNote').value = e.note || '';
            document.getElementById('fActive').value = e.is_active;
        } else {
            document.getElementById('modalTitle').textContent = 'Add Timetable Entry';
            document.getElementById('fExamName').value = '';
            document.getElementById('fExamDate').value = '';
            document.getElementById('fBranch').value = 'All';
            document.getElementById('fSemester').value = '';
            document.getElementById('fNote').value = '';
            document.getElementById('fActive').value = '1';
        }
        document.getElementById('ttModal').classList.add('open');
    }

    function closeModal() {
        document.getElementById('ttModal').classList.remove('open');
    }

    async function saveEntry() {
        const id = document.getElementById('editId').value;
        const payload = {
            exam_name: document.getElementById('fExamName').value.trim(),
            exam_date: document.getElementById('fExamDate').value,
            branch: document.getElementById('fBranch').value.trim() || 'All',
            semester: document.getElementById('fSemester').value.trim(),
            note: document.getElementById('fNote').value.trim(),
            is_active: parseInt(document.getElementById('fActive').value)
        };
        if (!payload.exam_name || !payload.exam_date) {
            alert('Exam name and date are required.');
            return;
        }
        const url = id ? `/api/admin/timetable/${id}` : '/api/admin/timetable';
        const method = id ? 'PUT' : 'POST';
        const res = await fetch(url, { method, headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload) });
        const data = await res.json();
        if (data.success) { closeModal(); loadEntries(); }
        else alert(data.error || 'Failed to save.');
    }

    async function deleteEntry(id) {
        if (!confirm('Delete this timetable entry?')) return;
        const res = await fetch(`/api/admin/timetable/${id}`, { method: 'DELETE' });
        const data = await res.json();
        if (data.success) loadEntries();
        else alert('Failed to delete.');
    }

    document.getElementById('ttModal').addEventListener('click', function(e) {
        if (e.target === this) closeModal();
    });

    loadEntries();
    </script>
</body>
</html>
